<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Nivalis interface preview</title>
  <desc id="desc">A calm gallery interface with sidebar, upload area and image cards.</desc>
